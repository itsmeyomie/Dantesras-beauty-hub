# Free nightly backup of the live Supabase database.
# The dump is ENCRYPTED with your passphrase before it is stored, because files of a
# public repository can be downloaded by anyone signed in to GitHub.
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_PASSWORD  the database password (Supabase → Project Settings → Database)
#   BACKUP_PASSPHRASE     a long passphrase you keep safe – without it the backups cannot be opened
# The password is passed on its own (never inside an address), so any characters work and
# it never appears in the public job log.
#
# Restore: see docs/backup.md
name: Nightly database backup

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 03:00 Kenya time
  workflow_dispatch:       # "Run workflow" button for a backup right now

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Supabase session pooler (Supabase → Connect → Session pooler) – not secret
      PGHOST: aws-1-eu-west-1.pooler.supabase.com
      PGPORT: '5432'
      PGUSER: postgres.frjflqepqhjkxfzknnoz
      PGDATABASE: postgres
      PGSSLMODE: require
    steps:
      - name: Check the secrets are set
        env:
          DBPASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DBPASS" ] || [ -z "$PASS" ]; then
            echo "::error::Add the SUPABASE_DB_PASSWORD and BACKUP_PASSPHRASE secrets first (see docs/backup.md)."
            exit 1
          fi

      - name: Dump the database (public schema)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE -e PGPASSWORD \
            -v "$PWD:/out" postgres:17 \
            pg_dump --schema=public --no-owner --no-privileges --format=custom --file=/out/dantesras.dump
          ls -l dantesras.dump

      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="dantesras-$(date -u +%Y-%m-%d).dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --symmetric --cipher-algo AES256 --output "$name" dantesras.dump
          rm dantesras.dump
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 30
          if-no-files-found: error
